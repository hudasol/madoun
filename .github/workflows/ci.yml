name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --omit dev --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          include-hidden-files: true
          retention-days: 1

  browser-checks:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: .next
      - name: Start the production server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 40); do curl -sf http://localhost:3000/api/v1/health && break; sleep 1; done
      - run: npm run a11y
      - run: npm run security
      - name: Stop the server
        if: always()
        run: kill "$(cat server.pid)" || true
      - run: npm run offline
      - name: Server log
        if: failure()
        run: cat server.log
